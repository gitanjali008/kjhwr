# Rendered by the nginx image's envsubst step; ${BACKEND_URL} comes from the environment.
server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass ${BACKEND_URL};
        proxy_set_header Host $host;
        proxy_read_timeout 120s;
    }

    location / {
        try_files $uri /index.html;
    }
}
